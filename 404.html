<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#0A0908">
  <title>Shuttls Tap</title>
  <link rel="icon" href="/app-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Newsreader:opsz,wght@6..72,600;6..72,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/site.css?v=20261004b">
</head>
<body class="land">
  <main id="main">
    <img class="logo-img" src="/logo.png" alt="Shuttls">
    <div class="badge" id="badge" aria-hidden="true">🏸</div>
    <div class="tap-top">
      <span class="tap-chip" id="chip" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M7 8a5.5 5.5 0 0 1 0 8M11 5.5a9.5 9.5 0 0 1 0 13M15 3a13.5 13.5 0 0 1 0 18"/></svg>Shuttls Tap</span>
      <h1 class="display" id="title">Page not found</h1>
      <p class="tap-make" id="make" hidden></p>
    </div>
    <p class="lede" id="description">This page doesn't exist. <a href="/">Back to Shuttls</a></p>
    <div class="stack" id="actions" hidden>
      <a id="open" class="btn btn-line">Open Shuttls</a>
    </div>
    <div class="specs" id="specs" hidden></div>
    <section class="tap-card" id="player" hidden>
      <span class="label">Player</span>
      <div class="who">
        <div class="avatar" id="avatar"></div>
        <div>
          <div class="who-name" id="whoName"></div>
          <div class="who-sub" id="whoSub">Shuttls player</div>
        </div>
      </div>
      <div class="stats" id="stats" hidden></div>
      <a class="btn btn-line" id="viewUser" href="#">View profile on Shuttls</a>
    </section>
    <a class="btn btn-gold tap-ios" id="ios" hidden href="https://apps.apple.com/us/app/shuttls-enhancing-badminton/id6756201633"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M18.71,19.5c-.83,1.24-1.71,2.45-3.1,2.48-1.37.03-1.81-.79-3.38-.79-1.58,0-2.07.77-3.39.82-1.32.05-2.32-1.32-3.15-2.54C4.0,17.0,2.71,12.45,4.47,9.38c.87-1.52,2.43-2.48,4.12-2.51,1.28-.02,2.5.87,3.29.87.78,0,2.26-1.07,3.81-.91.65.03,2.47.26,3.64,1.98-.09.06-2.17,1.26-2.15,3.77.02,3.02,2.6,4.03,2.63,4.04-.03.06-.53,1.2-1.31,2.36ZM15.25,5.18c.7-.84,1.16-2.01,1.03-3.18-1.01.04-2.23.67-2.95,1.52-.64.75-1.21,1.95-1.06,3.09,1.3.1,2.36-.54,2.98-.43Z"/></svg>Get Shuttls for iPhone</a>
    <p class="tap-foot" id="foot" hidden>New to Shuttls? Download the free app, sign up, and tap a racket to see its setup and add the player as a friend.</p>
  </main>
  <script>
    // GitHub Pages serves this file for any unknown path, so /t/<token> lands here.
    // Installed iPhones open the app via Universal Link before this loads; this is the fallback.
    const $ = (id) => document.getElementById(id);
    const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
    const m = location.pathname.match(/^\/t\/([A-Za-z0-9_-]{4,64})\/?$/);
    if (m) {
      const app = `shuttls://tap/${m[1]}`;
      $('title').textContent = 'Your Shuttls Tap';
      $('description').textContent = 'Open Shuttls to see this racket or connect the Tap to yours.';
      $('actions').hidden = false;
      $('ios').hidden = false;
      $('open').href = app;
      // Public rackets show their full card; private or unknown Taps keep the generic message above.
      fetch('https://hytqucmpyvjgrzaofjdi.supabase.co/rest/v1/rpc/public_tap', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', apikey: 'sb_publishable_dzXgfT8A0gJyf44iWaeDZA_Bft6EQNU' },
        body: JSON.stringify({ p_token: m[1] })
      }).then(r => r.json()).then(d => {
        if (d.state !== 'CLAIMED') return;
        const r = d.racket, o = d.owner || {};
        $('main').classList.add('tap');
        $('badge').hidden = true;
        $('chip').hidden = false;
        $('title').textContent = r.name;
        const make = [r.brand, r.model].filter(Boolean).join(' ');
        if (make) { $('make').textContent = make; $('make').hidden = false; }
        $('description').hidden = true;
        $('open').textContent = 'Open in Shuttls';
        document.title = r.name + ' | Shuttls Tap';

        const specs = [['Weight', r.weight_class], ['Grip', r.grip_size], ['String', r.string_name],
                       ['Tension', r.string_tension ? r.string_tension + ' lbs' : '']].filter(s => s[1]);
        specs.forEach(([k, v]) => { const s = el('div', 'spec'); s.append(el('span', 'label', k), el('b', '', v)); $('specs').append(s); });
        $('specs').style.setProperty('--n', specs.length); $('specs').hidden = !specs.length;

        if (o.username) {
          $('player').hidden = false;
          $('whoName').textContent = '@' + o.username;
          $('viewUser').href = app;
          $('viewUser').textContent = 'View @' + o.username + ' on Shuttls';
          if (typeof o.avatar_url === 'string' && /^https:\/\//.test(o.avatar_url)) {
            const img = el('img'); img.alt = ''; img.src = o.avatar_url;
            img.onerror = () => { $('avatar').textContent = o.username[0].toUpperCase(); };
            $('avatar').append(img);
          } else { $('avatar').textContent = o.username[0].toUpperCase(); }
          [[o.shuttl_score != null ? Number(o.shuttl_score).toFixed(2) : '', 'Shuttl Score'],
           [o.win_rate != null ? Math.round(o.win_rate) + '%' : '', 'Win rate'],
           [o.matches ? String(o.matches) : '', 'Ranked matches']].filter(s => s[0]).forEach(([v, k]) => {
            const s = el('div', 'stat'); s.append(el('b', 'num', v), el('span', 'label', k)); $('stats').append(s);
          });
          $('stats').style.setProperty('--n', $('stats').children.length); $('stats').hidden = !$('stats').children.length;
          if (o.league) $('whoSub').textContent = o.league + ' league';
        }
        $('foot').hidden = false;
      }).catch(() => {});
      if (/iPhone|iPad|iPod/i.test(navigator.userAgent)) location.replace(app);
    }
  </script>
</body>
</html>
