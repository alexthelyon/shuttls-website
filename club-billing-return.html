<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#0A0908">
  <title>Back to Shuttls</title>
  <link rel="icon" href="app-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Newsreader:opsz,wght@6..72,600;6..72,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="site.css?v=20261004d">
</head>
<body class="land">
  <main>
    <img class="logo-img" src="logo.png" alt="Shuttls">
    <div class="badge" aria-hidden="true">✅</div>
    <h1 class="display">Back to your club</h1>
    <p class="lede">Open Shuttls to see the latest status. Payments and memberships update once your payment is confirmed.</p>
    <div class="stack">
      <a id="open" class="btn btn-line" href="shuttls://">Open Shuttls</a>
      <a class="btn btn-gold" href="https://apps.apple.com/us/app/shuttls-enhancing-badminton/id6756201633">Get Shuttls for iPhone</a>
    </div>
    <p class="hint">You can close this page.</p>
  </main>
  <script>
    const id = new URLSearchParams(location.search).get('id');
    if (id && /^[0-9a-f-]{36}$/i.test(id)) document.getElementById('open').href = 'shuttls://club-billing?id=' + encodeURIComponent(id);
  </script>
</body>
</html>
