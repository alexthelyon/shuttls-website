<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0A0908">
  <title>Get Shuttls</title>
  <link rel="icon" href="app-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Newsreader:opsz,wght@6..72,600;6..72,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="site.css?v=20261004d">
</head>
<body class="land">
  <main id="main">
    <img class="logo-img" src="logo.png" alt="Shuttls">
    <h1 class="display">Good luck today!</h1>
    <p class="lede" id="lede">Track every game with your group. Download the free app.</p>
    <div class="stack" id="actions">
      <a id="ios" class="btn btn-gold" href="https://apps.apple.com/app/id6756201633">Get Shuttls for iPhone</a>
      <a id="android" class="btn btn-line" href="https://play.google.com/store/apps/details?id=com.shuttls.android">Get Shuttls for Android</a>
    </div>
  </main>
  <script>
    // The poster QR points here (shuttlsapp.com/get) so one printed code works for every phone.
    // Phones go straight to their store; anything else (desktop) sees both buttons above.
    const ua = navigator.userAgent;
    const ios = /iPhone|iPad|iPod/i.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
    const android = /Android/i.test(ua);
    if (ios) location.replace(document.getElementById('ios').href);
    else if (android) location.replace(document.getElementById('android').href);
  </script>
</body>
</html>
